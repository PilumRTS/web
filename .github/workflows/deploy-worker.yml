name: Deploy email and downloads

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilum-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: worker-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check and bundle the backend
        run: |
          npm run worker:check
          npm run worker:bundle
      - name: Record recovery point, apply migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec5b7df56f3a7683902b3c7a879ae340
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN in the worker-production environment.'
            exit 1
          fi
          npx --no-install wrangler d1 time-travel info pilum-downloads --config worker/wrangler.jsonc
          npx --no-install wrangler d1 migrations apply pilum-downloads --remote --config worker/wrangler.jsonc
          npx --no-install wrangler deploy --config worker/wrangler.jsonc --message "GitHub commit $GITHUB_SHA"
      - name: Verify public routes without sending email
        run: |
          set -euo pipefail
          for route in \
            https://mail.pilumrts.com/preferences \
            https://mail.pilumrts.com/unsubscribe \
            https://download.pilumrts.com/download \
            https://downloads.pilumrts.com/preferences; do
            status=$(curl --silent --show-error --max-time 20 --retry 3 --output "$RUNNER_TEMP/pilum-route.html" --write-out '%{http_code}' "$route")
            if [[ "$status" != '400' ]]; then
              echo "::error::Expected the branded missing-link response from $route; received $status."
              exit 1
            fi
            PILUM_RESPONSE="$RUNNER_TEMP/pilum-route.html" node --input-type=module -e "import {readFileSync} from 'node:fs'; if (!readFileSync(process.env.PILUM_RESPONSE, 'utf8').includes('PILUM')) process.exit(1);"
          done
          curl --fail --silent --show-error --max-time 20 --retry 3 --output /dev/null https://mail.pilumrts.com/assets/pilum-helmet-cream-v1.png
          curl --fail --silent --show-error --max-time 20 --retry 3 --output /dev/null https://mail.pilumrts.com/assets/pilum-wordmark-din-v1.png
